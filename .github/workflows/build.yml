name: Build openapi-yagen
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        env:
          DOCKER_BUILDX_ARGS: --cache-from type=gha --cache-to type=gha,mode=max
        run: ./build-musl.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-yagen
          path: dist/openapi-yagen

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/openapi-yagen

  # Both generators' READMEs claim their generated code "works unchanged on every platform Ktor
  # supports (JVM, Native)" - this is what actually checks that, instead of only ever compiling
  # the generated output under the JVM target (see each test/build.gradle.kts's own comment on
  # why it's a Kotlin Multiplatform project). Compile-only ("compile is the floor") - no
  # Kotlin/Native test framework is wired up, see AGENTS.md/TODO-improvements.md.
  kotlin-native-compile-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('generators/*/test/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}

      # A plain local (non-musl) build is enough - this binary is only used to run `generate`
      # against each generator's kitchen-sink spec, not distributed.
      - name: Build openapi-yagen CLI
        run: |
          pip install conan
          conan profile detect --force
          conan install . --output-folder=build --build=missing
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j --target openapi-yagen

      - name: kotlin_ktor_server_generator - compile generated code for linuxX64
        working-directory: generators/kotlin_ktor_server_generator/test
        env:
          OPENAPI_YAGEN: ${{ github.workspace }}/build/cli/openapi-yagen
        run: ./gradlew compileKotlinLinuxX64 --console=plain

      - name: kotlin_ktor_client_generator - compile generated code for linuxX64
        working-directory: generators/kotlin_ktor_client_generator/test
        env:
          OPENAPI_YAGEN: ${{ github.workspace }}/build/cli/openapi-yagen
        run: ./gradlew compileKotlinLinuxX64 --console=plain
