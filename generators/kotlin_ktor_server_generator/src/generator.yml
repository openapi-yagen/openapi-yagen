# Generator name
name: kotlin_ktor_server

# Generator description
description: >-
  Ktor server routing generator. Generates one routing class + one handler interface per
  OpenAPI tag. The routing class takes a caller-supplied io.ktor.server.routing.Route in its
  constructor and an implementation of the handler interface - no HTTP engine is chosen by the
  generated code, so it works on every server platform Ktor supports (JVM, Native). Incoming
  requests (path/query/header parameters and, where constrained, the request body) are parsed
  and validated before the handler is called, using shared validator functions (see
  Validation.kt) instead of duplicating checks per operation.

# Main JavaScript file (entrypoint).
mainScriptPath: main.js

# The OpenAPI version this generator's main.js/templates are written to consume - the engine
# converts the input spec to this version before running main.js if it declares a different one.
openApiVersion: "3.0"

# Variables that can be used to customize script execution
variables:
  - name: packageName
    description: Kotlin package for the generated routes, handler and model classes (e.g. com.example.petstore)
    required: true
  - name: strict
    description: >-
      When "true" (default), a schema or operation the generator can't handle aborts generation
      with an error. Set to "false" to instead skip it with a printed warning and generate
      everything else - useful for large real-world specs where a handful of unsupported
      constructs shouldn't block the rest of the generated code.
    defaultValue: "true"
  - name: dateTimeType
    description: >-
      Kotlin type generated for `type: string, format: date-time` properties/parameters. One of:
      "kotlinx.datetime.Instant" (default - needs kotlinx-datetime < 0.7.0), "kotlin.time.Instant"
      (needs kotlinx-datetime >= 0.7.0 and Kotlin >= 2.1), or "String" (no parsing, no
      kotlinx-datetime dependency for date-time fields).
    defaultValue: "kotlinx.datetime.Instant"
  - name: generate
    description: >-
      What to generate. "all" (default): models plus the routes/handlers. "models": only
      models/<Name>.kt - nothing else. "api": everything except models/<Name>.kt (routes,
      handlers, Validation.kt, and the model validate() extensions in ModelValidation.kt). Use
      "models"/"api" together across a client+server pair sharing one spec/packageName in a
      Kotlin Multiplatform project - e.g. one "models" run feeds a `shared` module, and both the
      client and server generators run with "api" against it. See README's "Sharing models"
      section.
    defaultValue: "all"
