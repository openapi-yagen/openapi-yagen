openapi: 3.1.0
info:
  title: Kitchen Sink (python_tornado_server_generator test fixture)
  version: "1.0"
  description: >-
    A small, purpose-built spec exercising every feature this generator's README claims to support:
    object/map schemas, allOf-single-$ref unwrapping, const, OAS 3.1 nullable, enums, discriminated
    and undiscriminated oneOf/anyOf, required/optional/array-typed query and header parameters, a
    JSON body, a binary body, multipart/form-data and application/x-www-form-urlencoded bodies, a
    text/plain response, an empty response, bearer and apiKey security schemes, and one path with
    two HTTP methods (GET+POST on the same RequestHandler class).
tags:
  - name: Widgets
    description: Operations for browsing and managing widgets - exercises document-level
      tags[].description reaching the generated handler interface's own docstring.
paths:
  /widgets:
    get:
      operationId: listWidgets
      tags: [Widgets]
      summary: List all widgets.
      description: Returns every known widget, optionally filtered by owner.
      parameters:
        - name: owner
          in: query
          required: false
          description: Only return widgets owned by this user.
          schema:
            type: string
            minLength: 1
        - name: status
          in: query
          required: false
          description: Only return widgets with this status.
          schema:
            $ref: "#/components/schemas/WidgetStatus"
        - name: tags
          in: query
          required: false
          description: Only return widgets with any of these tags (repeated query key).
          schema:
            type: array
            items:
              type: string
        - name: session_id
          in: cookie
          required: false
          description: "Exercises a cookie parameter."
          schema:
            type: string
      responses:
        "200":
          description: A list of widgets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
    post:
      operationId: createWidget
      tags: [Widgets]
      summary: Create a widget.
      parameters:
        - name: X-Request-ID
          in: header
          required: true
          description: Correlates this request in logs.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewWidget"
      responses:
        "201":
          description: Widget created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/reset:
    post:
      operationId: resetWidgets
      tags: [Widgets]
      summary: Delete every widget.
      responses:
        "200":
          description: Reset accepted; no response body.

  /widgets/export:
    get:
      operationId: exportWidgets
      tags: [Widgets]
      summary: Export every widget as a binary archive.
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: A tar archive of every widget.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /widgets/{widgetId}:
    get:
      operationId: getWidgetById
      tags: [Widgets]
      summary: Get a widget by ID.
      description: Returns a single widget by its identifier.
      parameters:
        - name: widgetId
          in: path
          required: true
          description: Identifier of the widget to fetch.
          schema:
            type: integer
      responses:
        "200":
          description: The requested widget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "404":
          description: No widget with this ID exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWidget
      tags: [Widgets]
      summary: Delete a widget.
      description: Exercises a bearer-token security scheme.
      security:
        - bearerAuth: []
      parameters:
        - name: widgetId
          in: path
          required: true
          description: Identifier of the widget to delete.
          schema:
            type: integer
      responses:
        "204":
          description: Widget deleted.

  /widgets/{widgetId}/photo:
    post:
      operationId: uploadWidgetPhoto
      tags: [Widgets]
      summary: Upload a widget's photo.
      description: Exercises multipart/form-data request bodies.
      parameters:
        - name: widgetId
          in: path
          required: true
          description: Identifier of the widget to attach the photo to.
          schema:
            type: integer
      requestBody:
        required: true
        description: The photo to attach.
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/WidgetPhotoUpload"
      responses:
        "204":
          description: Photo uploaded.

  /widgets/{widgetId}/subscribe:
    post:
      operationId: subscribeToWidget
      tags: [Widgets]
      summary: Subscribe to updates for a widget.
      description: Exercises application/x-www-form-urlencoded request bodies.
      parameters:
        - name: widgetId
          in: path
          required: true
          description: Identifier of the widget to subscribe to.
          schema:
            type: integer
      requestBody:
        required: true
        description: The subscription details.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WidgetSubscription"
      responses:
        "204":
          description: Subscribed.

  /widgets/{widgetId}/favorite:
    post:
      operationId: favoriteWidget
      tags: [Widgets]
      summary: Mark a widget as a favorite.
      description: >-
        Exercises an oauth2 security scheme (treated identically to http/bearer - an OAuth2 access
        token travels as an Authorization: Bearer header regardless of flow) combined with an
        OR-alternative security requirement: either oauth2Auth OR apiKeyAuth satisfies the request.
      security:
        - oauth2Auth: [write:widgets]
        - apiKeyAuth: []
      parameters:
        - name: widgetId
          in: path
          required: true
          description: Identifier of the widget to favorite.
          schema:
            type: integer
      responses:
        "204":
          description: Favorited.

  /widgets/{widgetId}/archive:
    post:
      operationId: archiveWidget
      tags: [Widgets]
      summary: Archive a widget.
      description: >-
        Exercises an OR-alternative security requirement where one alternative itself requires two
        schemes together (AND-within-OR): either (oauth2Auth AND apiKeyAuth together) OR bearerAuth
        alone satisfies the request.
      security:
        - oauth2Auth: [write:widgets]
          apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - name: widgetId
          in: path
          required: true
          description: Identifier of the widget to archive.
          schema:
            type: integer
      responses:
        "204":
          description: Archived.

  /widgets/shapes/{shapeId}:
    get:
      operationId: getShapeById
      tags: [Widgets]
      summary: Get a shape by ID.
      description: Returns a discriminated-union Shape (Circle or Square).
      parameters:
        - name: shapeId
          in: path
          required: true
          description: Identifier of the shape to fetch.
          schema:
            type: string
      responses:
        "200":
          description: The requested shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shape"

  /health:
    get:
      operationId: healthCheck
      tags: [Widgets]
      summary: Check service health.
      responses:
        "200":
          description: The service is healthy.
          content:
            text/plain:
              schema:
                type: string
                const: OK

components:
  schemas:
    ErrorResponse:
      type: object
      description: A validation or processing error.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

    WidgetLabels:
      type: object
      description: Free-form string labels attached to a widget.
      additionalProperties:
        type: string

    NewWidget:
      type: object
      description: Fields needed to create a new widget.
      additionalProperties: false
      required: [name, owner]
      properties:
        name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 64
        owner:
          type: string
          description: Owning user.
        note:
          type: [string, "null"]
          description: Optional free-text note; explicitly nullable.
        labels:
          allOf:
            - $ref: "#/components/schemas/WidgetLabels"
          description: Arbitrary string labels for this widget.
        status:
          allOf:
            - $ref: "#/components/schemas/WidgetStatus"
          description: Initial lifecycle status.
        variant:
          allOf:
            - $ref: "#/components/schemas/WidgetVariant"
          description: Free-form variant payload.
        sku:
          type: string
          format: uuid
          description: "Exercises format: uuid validation."
        manufacturedOn:
          type: string
          format: date
          description: "Exercises format: date - a real datetime.date type, parse-as-validation."
        scheduledFor:
          type: string
          format: date-time
          description: "Exercises format: date-time - a real datetime.datetime type, parse-as-validation."
        priority:
          type: integer
          default: 1
          description: "Exercises a numeric default value applied by from_wire when the key is absent."
        visibility:
          type: string
          enum: [public, private]
          default: public
          description: "Exercises an enum default value, resolved to its generated Python constant."

    Widget:
      type: object
      description: A single widget.
      additionalProperties: false
      required: [id, name, owner]
      properties:
        id:
          type: integer
          description: Server-assigned identifier.
        name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 64
        owner:
          type: string
          description: Owning user.
        note:
          type: [string, "null"]
          description: Optional free-text note; explicitly nullable.
        labels:
          allOf:
            - $ref: "#/components/schemas/WidgetLabels"
          description: Arbitrary string labels for this widget.
        status:
          allOf:
            - $ref: "#/components/schemas/WidgetStatus"
          description: Current lifecycle status.
        variant:
          allOf:
            - $ref: "#/components/schemas/WidgetVariant"
          description: Free-form variant payload.

    WidgetStatus:
      type: string
      description: Adoption/lifecycle status of a widget.
      enum: [available, pending, retired]

    Shape:
      description: A discriminated union - dispatched via the `shapeType` discriminator.
      oneOf:
        - $ref: "#/components/schemas/Circle"
        - $ref: "#/components/schemas/Square"
      discriminator:
        propertyName: shapeType
        mapping:
          circle: "#/components/schemas/Circle"
          square: "#/components/schemas/Square"

    Circle:
      type: object
      description: A circular shape.
      required: [shapeType, radius]
      properties:
        shapeType:
          type: string
          description: Discriminator identifying this variant as a circle.
        radius:
          type: number
          description: Radius of the circle.

    Square:
      type: object
      description: A square shape.
      required: [shapeType, side]
      properties:
        shapeType:
          type: string
          description: Discriminator identifying this variant as a square.
        side:
          type: number
          description: Side length of the square.

    WidgetVariant:
      description: >-
        An undiscriminated union ("union" kind): two object-shaped variants disambiguated by a
        required property unique to each, and a bare string variant to exercise the non-object
        dispatch branch.
      oneOf:
        - $ref: "#/components/schemas/WidgetVariantA"
        - $ref: "#/components/schemas/WidgetVariantB"
        - type: string

    WidgetVariantA:
      type: object
      description: The "kind/value" shaped widget variant.
      required: [kind, value]
      properties:
        kind:
          type: string
          description: Distinguishing property unique to this variant.
        value:
          type: integer
          description: The variant's own integer payload.

    WidgetVariantB:
      type: object
      description: The "label" shaped widget variant.
      required: [label]
      properties:
        label:
          type: string
          description: Distinguishing property unique to this variant.

    WidgetPhotoUpload:
      type: object
      description: Multipart form fields for uploading a widget's photo.
      required: [photo]
      properties:
        caption:
          type: string
          description: Optional caption for the photo.
        photo:
          type: string
          format: binary
          description: The photo's raw bytes, received as a plain form field.

    WidgetSubscription:
      type: object
      description: Form fields for subscribing to widget updates.
      required: [email]
      properties:
        email:
          type: string
          description: Subscriber's email address.
        notify:
          type: boolean
          description: Whether to send notifications immediately.
        channels:
          description: "Exercises an array-of-string urlencoded form field (one repeated key per element)."
          type: array
          items:
            type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A bearer token in the Authorization header.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: An API key in the X-Api-Key header.
    oauth2Auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/oauth/token
          scopes:
            write:widgets: Modify widgets
