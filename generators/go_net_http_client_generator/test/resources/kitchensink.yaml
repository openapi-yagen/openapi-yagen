openapi: 3.0.3
info:
  title: Kitchen Sink (go_net_http_client_generator test fixture)
  version: "1.0"
  description: >-
    A small, purpose-built spec exercising every feature this generator's README claims to
    support (required/optional/nullable properties, every constraint kind, enums, arrays with and
    without uniqueItems, discriminated and undiscriminated oneOf/anyOf, path/query/header
    parameters, array-typed query parameters) plus operations designed to trigger validation
    errors and not-found responses.
tags:
  - name: pets
    description: Operations for browsing and managing pets - also exercises document-level
      tags[].description reaching the generated tag client's own doc comment.
  - name: widgets
    description: Operations for the oneOf/anyOf coverage vehicle (see WidgetVariant below).
  - name: files
    description: Raw binary uploads/downloads - every operation here only uses raw bodies, no models.
  - name: jobs
    description: Operations with more than one success response, picked by the response status.
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List all pets.
      description: |
        Returns a page of pets, optionally filtered by tag or tags.

        A multi-line description - every line must stay inside the generated doc comment.
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of pets to return.
            Continues on a second line.
          schema:
            type: integer
            maximum: 100
        - name: tag
          in: query
          required: false
          description: Only return pets with this tag.
          schema:
            type: string
        - name: tags
          in: query
          required: false
          description: Only return pets with any of these tags (repeated query key).
          schema:
            type: array
            items:
              type: string
        - name: tagsCsv
          in: query
          required: false
          style: form
          explode: false
          description: Array-typed query parameter with explode:false - comma-joined `tagsCsv=a,b`.
          schema:
            type: array
            items:
              type: string
        - name: tagsSpace
          in: query
          required: false
          style: spaceDelimited
          explode: false
          description: Array-typed query parameter with style:spaceDelimited - space-joined.
          schema:
            type: array
            items:
              type: string
        - name: tagsPipe
          in: query
          required: false
          style: pipeDelimited
          explode: false
          description: Array-typed query parameter with style:pipeDelimited - pipe-joined.
          schema:
            type: array
            items:
              type: string
        - name: session_id
          in: cookie
          required: false
          description: Exercises a cookie parameter.
          schema:
            type: string
      responses:
        "200":
          description: A page of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pets/{petId}:
    get:
      operationId: getPetById
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      operationId: deletePet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /pets/{petId}/ratings:
    post:
      operationId: ratePet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rating"
      responses:
        "204":
          description: Recorded
  /pets/{petId}/photo:
    post:
      operationId: uploadPetPhoto
      tags: [pets]
      description: Exercises multipart/form-data request bodies.
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PetPhotoUpload"
      responses:
        "204":
          description: Photo uploaded
  /pets/{petId}/subscribe:
    post:
      operationId: subscribeToPet
      tags: [pets]
      description: Exercises application/x-www-form-urlencoded request bodies.
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PetSubscription"
      responses:
        "204":
          description: Subscribed
  /pets/{petId}/notes:
    post:
      operationId: setPetNotes
      tags: [pets]
      description: Exercises a text-content-type request AND response body (a plain string, not JSON-encoded).
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Notes stored; echoes them back
          content:
            text/plain:
              schema:
                type: string
  /pets/{petId}/avatar:
    put:
      operationId: uploadPetAvatar
      tags: [pets]
      description: Exercises a raw-bytes (non-text, non-JSON) request AND response body.
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Avatar stored; echoes it back
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /widgets:
    get:
      operationId: listWidgets
      tags: [widgets]
      parameters:
        - name: status
          in: query
          required: false
          description: >-
            An enum-typed query parameter - the wire value (e.g. "sold-out") differs from the
            generated Go constant name (e.g. WidgetStatusSoldOut), exercising the round-trip
            through the enum's underlying string type.
          schema:
            type: string
            enum: [available, pending, sold-out]
        - name: id
          in: query
          required: false
          description: >-
            A primitive-shaped anyOf query parameter (either a numeric id or a string slug) -
            since a query value is always just a string on the wire anyway, this is passed
            straight through as a plain string rather than a typed union.
          schema:
            anyOf:
              - type: integer
              - type: string
        - name: X-Client-Version
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A page of widgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widgets"
    post:
      operationId: createWidget
      tags: [widgets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Widget"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /widgets/shapes/{shapeId}:
    get:
      operationId: getShape
      tags: [widgets]
      parameters:
        - name: shapeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shape"
  /files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: putFile
      tags: [files]
      summary: Store a file, streamed from the request body.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stored
    get:
      operationId: getFile
      tags: [files]
      summary: Download a file, with Range support.
      responses:
        "200":
          description: The whole file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: A byte range of the file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /files/{fileId}/echo:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: echoFile
      tags: [files]
      summary: Echo an optional body of any application/* media type back.
      requestBody:
        content:
          application/*:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The echoed body
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /jobs/archive:
    post:
      operationId: createArchive
      tags: [jobs]
      summary: Build an archive - synchronously (200, the archive itself) or in the background (202).
      parameters:
        - name: sync
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: The finished archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "202":
          description: Archive job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/rebuild:
    post:
      operationId: rebuild
      tags: [jobs]
      responses:
        "202":
          description: Rebuild job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "204":
          description: Nothing to rebuild
  /jobs/ping:
    post:
      operationId: ping
      tags: [jobs]
      description: Two success responses, neither with a body.
      responses:
        "200":
          description: Pong
        "204":
          description: Nothing to say
  /sessions/{sessionId}:
    put:
      operationId: putSession
      tags: [extras]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: count
          in: query
          schema:
            $ref: "#/components/schemas/Counter"
        - name: ids
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Identifier"
        - name: since
          in: query
          schema:
            type: string
            format: date
        - name: code
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 4
        - name: ratio
          in: query
          schema:
            type: number
            maximum: 1
        - name: lookahead
          in: query
          description: A pattern Go's regexp can't express - generated without the check.
          schema:
            type: string
            pattern: "^(?=a).*$"
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Session"
      responses:
        "200":
          description: Echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /forms/optional:
    post:
      operationId: optionalForm
      tags: [extras]
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/NamedForm"
      responses:
        "200":
          description: Echo of what arrived
          content:
            text/plain:
              schema:
                type: string
  /forms/optional-upload:
    post:
      operationId: optionalUpload
      tags: [extras]
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/NamedForm"
      responses:
        "200":
          description: Echo of what arrived
          content:
            text/plain:
              schema:
                type: string
  /forms/optional-note:
    post:
      operationId: optionalNote
      tags: [extras]
      requestBody:
        required: false
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Echo of what arrived
          content:
            text/plain:
              schema:
                type: string
  /forms/named:
    post:
      operationId: namedForm
      tags: [extras]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/NamedForm"
      responses:
        "200":
          description: Echo of what arrived
          content:
            text/plain:
              schema:
                type: string
  /timelines/{since}:
    put:
      operationId: putTimeline
      tags: [extras]
      parameters:
        - name: since
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: until
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Timestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Timeline"
      responses:
        "200":
          description: Echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
  /timestamp:
    post:
      operationId: echoTimestamp
      tags: [extras]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Timestamp"
      responses:
        "200":
          description: Echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timestamp"
  /person:
    post:
      operationId: echoPerson
      tags: [extras]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonData"
      responses:
        "200":
          description: Echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonData"
  /scores:
    post:
      operationId: echoScores
      tags: [extras]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scores"
      responses:
        "200":
          description: Echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scores"
  /secure/bearer:
    get:
      operationId: secureBearer
      tags: [extras]
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Ok
  /secure/and:
    get:
      operationId: secureAnd
      tags: [extras]
      security: [{apiKeyQuery: [], sessionCookie: []}]
      responses:
        "204":
          description: Ok
  /secure/or:
    get:
      operationId: secureOr
      tags: [extras]
      security: [{apiKeyHeader: []}, {bearerAuth: []}]
      responses:
        "204":
          description: Ok
  /secure/optional:
    get:
      operationId: secureOptional
      tags: [extras]
      security: [{}, {bearerAuth: []}]
      responses:
        "204":
          description: Ok
  /secure/basic:
    get:
      operationId: secureBasic
      tags: [extras]
      security: [{basicAuth: []}]
      responses:
        "204":
          description: Ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Timestamp:
      type: string
      format: date-time
    Timeline:
      type: object
      required: [createdAt]
      properties:
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        history:
          type: array
          items:
            $ref: "#/components/schemas/Timestamp"
        marker:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: integer
    Quantity:
      type: integer
      format: int32
    IdentifierList:
      type: array
      items:
        $ref: "#/components/schemas/Identifier"
    NamedForm:
      type: object
      required: [owner]
      properties:
        at:
          $ref: "#/components/schemas/Timestamp"
        owner:
          $ref: "#/components/schemas/Identifier"
        alias:
          $ref: "#/components/schemas/Identifier"
        quantity:
          $ref: "#/components/schemas/Quantity"
        members:
          $ref: "#/components/schemas/IdentifierList"
        quantities:
          type: array
          items:
            $ref: "#/components/schemas/Quantity"
    Identifier:
      type: string
      pattern: "^[a-z]+$"
    Counter:
      type: integer
      minimum: 1
    Channel:
      description: Known channels, open to new ones.
      anyOf:
        - type: string
          enum: [web, mobile]
        - type: string
    Operation:
      type: string
      enum: [identification]
    Session:
      type: object
      required: [operation, channel, id, tags, serverId, secret, comment]
      properties:
        operation:
          $ref: "#/components/schemas/Operation"
        channel:
          $ref: "#/components/schemas/Channel"
        id:
          $ref: "#/components/schemas/Identifier"
        ownerId:
          $ref: "#/components/schemas/Identifier"
        attempts:
          $ref: "#/components/schemas/Counter"
        tags:
          type: array
          items:
            type: string
        serverId:
          type: string
          readOnly: true
        secret:
          type: string
          writeOnly: true
        comment:
          type: string
          nullable: true
    PersonData:
      type: object
      additionalProperties: true
      properties:
        firstName:
          type: string
    Score:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          maximum: 10
    Scores:
      type: object
      required: [title]
      properties:
        title:
          type: string
        level:
          type: integer
          default: 3
        AdditionalProperties:
          type: string
      additionalProperties:
        $ref: "#/components/schemas/Score"
    Job:
      type: object
      required: [id]
      properties:
        id:
          type: string
    Pet:
      description: A pet available in the store.
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: The pet's display name.
        tag:
          type: string
        notes:
          type: string
        status:
          $ref: "#/components/schemas/PetStatus"
        createdAt:
          type: string
          format: date-time
          description: When the pet was added to the store.
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        tag:
          type: string
        notes:
          type: string
        status:
          $ref: "#/components/schemas/PetStatus"
        sku:
          type: string
          format: uuid
          description: "Exercises format: uuid Validate() checking."
        birthDate:
          type: string
          format: date
          description: "Exercises format: date Validate() checking."
        priority:
          type: integer
          default: 1
          description: "Exercises a numeric default value applied by UnmarshalJSON when absent."
        visibility:
          type: string
          enum: [public, private]
          default: public
          description: "Exercises an enum default value, resolved to its generated Go constant."
    PetStatus:
      description: A pet's availability status.
      type: string
      enum: [available, pending, sold]
    Rating:
      type: object
      required: [score, label]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        label:
          type: string
          minLength: 2
          maxLength: 20
          pattern: "^[a-z]+$"
    PetPhotoUpload:
      type: object
      required: [photo]
      properties:
        caption:
          type: string
        photo:
          type: string
          format: binary
    PetSubscription:
      type: object
      required: [email]
      properties:
        email:
          type: string
        notify:
          type: boolean
        channels:
          description: >-
            Exercises an array-of-scalar form field (repeated form key, e.g. channels=sms&channels=email).
          type: array
          items:
            type: string
    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
    Pets:
      description: A page of pets.
      type: array
      items:
        $ref: "#/components/schemas/Pet"
    TagSet:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/Tag"
    Widget:
      type: object
      required: [id, name, variant]
      properties:
        id:
          type: integer
        name:
          type: string
        tags:
          $ref: "#/components/schemas/TagSet"
        variant:
          $ref: "#/components/schemas/WidgetVariant"
    Widgets:
      type: array
      items:
        $ref: "#/components/schemas/Widget"
    Shape:
      description: A discriminated union - dispatched via the `shapeType` discriminator.
      oneOf:
        - $ref: "#/components/schemas/Circle"
        - $ref: "#/components/schemas/Square"
      discriminator:
        propertyName: shapeType
        mapping:
          circle: "#/components/schemas/Circle"
          square: "#/components/schemas/Square"
    Circle:
      type: object
      required: [shapeType, radius]
      properties:
        shapeType:
          type: string
        radius:
          type: number
          minimum: 0
    Square:
      type: object
      required: [shapeType, side]
      properties:
        shapeType:
          type: string
        side:
          type: number
    WidgetVariant:
      description: >-
        An undiscriminated union ("union" kind): two object-shaped variants disambiguated by a
        required property unique to each, a bare string variant to exercise the non-object
        dispatch branch, a third object-shaped variant disambiguated by an optional (not
        required) property unique to it, and a trailing unconstrained ("{}") catch-all variant
        for any other JSON shape.
      oneOf:
        - $ref: "#/components/schemas/WidgetVariantA"
        - $ref: "#/components/schemas/WidgetVariantB"
        - type: string
        - $ref: "#/components/schemas/WidgetVariantC"
        - {}
    EnvelopeUnion:
      description: >-
        An undiscriminated oneOf that resolveUnionDispatch can NOT tell apart: all three variants
        share the exact same top-level properties (meta + payload), differing only in the nested
        shape of payload (array vs. an object with a uniquely-declared field vs. a fieldless
        object) - a common real-world "envelope" API shape. This must fall back to an untyped
        ("alias" kind) value with a generation-time warning instead of failing generation.
      oneOf:
        - $ref: "#/components/schemas/EnvelopeArrayResult"
        - $ref: "#/components/schemas/EnvelopeTaggedResult"
        - $ref: "#/components/schemas/EnvelopePlainResult"
    EnvelopeArrayResult:
      type: object
      properties:
        meta:
          type: object
          properties:
            code:
              type: integer
        payload:
          type: array
          items:
            type: string
    EnvelopeTaggedResult:
      type: object
      properties:
        meta:
          type: object
          properties:
            code:
              type: integer
        payload:
          type: object
          required: [tag]
          properties:
            tag:
              type: string
    EnvelopePlainResult:
      type: object
      properties:
        meta:
          type: object
          properties:
            code:
              type: integer
        payload:
          type: object
          properties:
            note:
              type: string
    WidgetVariantA:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
        value:
          type: integer
    WidgetVariantB:
      type: object
      required: [label]
      properties:
        label:
          type: string
    WidgetVariantC:
      type: object
      properties:
        note:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
