# Reference spec exercising every construct in Stage 1's scope (see the design doc's "Fidelity"
# section) - used by test/v3_reader_writer_test.cpp to check the reader/writer/converter against
# more than just petstore-shaped basics.
openapi: "3.1.0"
info:
  title: Full Construct Test API
  summary: Exercises every Stage 1 construct
  description: Reference spec for OpenApi::V3::Read/Write round-trip testing.
  termsOfService: https://example.com/terms
  contact:
    name: API Team
    url: https://example.com/contact
    email: api@example.com
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  version: 2.0.0
servers:
  - url: https://{env}.example.com/{basePath}
    description: Configurable environment server
    variables:
      env:
        enum: [prod, staging]
        default: prod
        description: Deployment environment
      basePath:
        default: v2
tags:
  - name: widgets
    description: Widget operations
    externalDocs:
      description: More about widgets
      url: https://example.com/docs/widgets
externalDocs:
  description: Full API docs
  url: https://example.com/docs
security:
  - ApiKeyAuth: []
  - OAuth2: [read:widgets, write:widgets]
paths:
  /widgets:
    summary: Widget collection
    get:
      operationId: listWidgets
      tags: [widgets]
      deprecated: false
      parameters:
        - name: search
          in: query
          description: Free-text search
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A list of widgets
          headers:
            X-Rate-Limit:
              description: Requests remaining
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
              examples:
                sample:
                  summary: Sample list
                  value: []
          links:
            GetWidgetById:
              operationId: getWidget
              parameters:
                widgetId: "$response.body#/0/id"
    post:
      operationId: createWidget
      tags: [widgets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Widget"
            encoding:
              metadata:
                contentType: application/json
                headers:
                  X-Meta-Version:
                    schema:
                      type: string
      callbacks:
        widgetCreated:
          "{$request.body#/callbackUrl}":
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/Widget"
              responses:
                "200":
                  description: Callback acknowledged
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      tags: [widgets]
      parameters:
        - $ref: "#/components/parameters/WidgetIdParam"
      responses:
        "200":
          description: A single widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
webhooks:
  widgetPing:
    post:
      operationId: widgetPing
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Acknowledged
components:
  schemas:
    Widget:
      type: object
      title: Widget
      description: A widget
      required: [id, kind]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: [string, "null"]
          description: Nullable via OAS 3.1 type array
        weight:
          type: number
          minimum: 0
          exclusiveMinimum: 0
          maximum: 1000
        rating:
          type: integer
          const: 5
        tags:
          type: array
          items:
            type: string
          uniqueItems: true
        kind:
          type: string
          enum: [basic, premium]
        extra:
          type: object
          additionalProperties:
            type: string
          maxProperties: 10
      xml:
        name: widget
      externalDocs:
        url: https://example.com/docs/widget-schema
      examples:
        - id: 1
          kind: basic
      discriminator:
        propertyName: kind
        mapping:
          basic: "#/components/schemas/Widget"
    Named:
      allOf:
        - $ref: "#/components/schemas/Widget"
        - type: object
          properties:
            label:
              type: string
  parameters:
    WidgetIdParam:
      name: widgetId
      in: path
      required: true
      schema:
        type: integer
  headers:
    RateLimitHeader:
      description: Shared rate-limit header
      schema:
        type: integer
  examples:
    WidgetExample:
      summary: A widget example
      value:
        id: 1
        kind: basic
  links:
    GetWidgetByIdShared:
      operationId: getWidget
      parameters:
        widgetId: "$response.body#/id"
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-Api-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/oauth/authorize
          tokenUrl: https://example.com/oauth/token
          scopes:
            read:widgets: Read widgets
            write:widgets: Write widgets
  pathItems:
    SharedPathItem:
      get:
        operationId: sharedGet
        responses:
          "200":
            description: OK
