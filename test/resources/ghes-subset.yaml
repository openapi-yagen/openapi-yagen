openapi: 3.0.3
info:
  title: GitHub Enterprise Server API (test subset)
  version: 1.1.4
  description: A small, hand-curated subset of the real GitHub Enterprise Server 3.15 REST API spec (see
    ghes-3.15.yaml), extracted for integration testing the Kotlin/Ktor generators against real-world spec
    content. Only operations whose full schema closure is compatible with the generators' documented v1
    limitations (discriminated-only oneOf/anyOf, no inline oneOf/anyOf) were kept - see extract_github_subset.py
    used to produce this file.
paths:
  /repos/{owner}/{repo}/labels:
    get:
      summary: List labels for a repository
      description: Lists all labels for a repository.
      tags:
      - issues
      operationId: issues/list-labels-for-repo
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.15/rest/issues/labels#list-labels-for-a-repository
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/label'
              examples:
                default:
                  $ref: '#/components/examples/label-items'
          headers:
            Link:
              $ref: '#/components/headers/link'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: labels
    post:
      summary: Create a label
      description: Creates a label for the specified repository with the given name and color. The name
        and color parameters are required. The color must be a valid [hexadecimal color code](http://www.color-hex.com/).
      tags:
      - issues
      operationId: issues/create-label
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.15/rest/issues/labels#create-a-label
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the label. Emoji can be added to label names, using either
                    native emoji or colon-style markup. For example, typing `:strawberry:` will render
                    the emoji ![:strawberry:](https://github.githubassets.com/images/icons/emoji/unicode/1f353.png
                    ":strawberry:"). For a full list of available emoji and codes, see "[Emoji cheat sheet](https://github.com/ikatyang/emoji-cheat-sheet)."
                color:
                  type: string
                  description: The [hexadecimal color code](http://www.color-hex.com/) for the label,
                    without the leading `#`.
                description:
                  type: string
                  description: A short description of the label. Must be 100 characters or fewer.
              required:
              - name
            examples:
              default:
                value:
                  name: bug
                  description: Something isn't working
                  color: f29513
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/label'
              examples:
                default:
                  $ref: '#/components/examples/label'
          headers:
            Location:
              example: https://api.github.com/repos/octocat/Hello-World/labels/bug
              schema:
                type: string
        '422':
          $ref: '#/components/responses/validation_failed'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: labels
  /repos/{owner}/{repo}:
    get:
      summary: Get a repository
      description: 'The `parent` and `source` objects are present when the repository is a fork. `parent`
        is the repository this repository was forked from, `source` is the ultimate source for the network.


        > [!NOTE]

        > In order to see the `security_and_analysis` block for a repository you must have admin permissions
        for the repository or be an owner or security manager for the organization that owns the repository.
        For more information, see "[Managing security managers in your organization](https://docs.github.com/enterprise-server@3.15/organizations/managing-peoples-access-to-your-organization-with-roles/managing-security-managers-in-your-organization)."'
      tags:
      - repos
      operationId: repos/get
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.15/rest/repos/repos#get-a-repository
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/full-repository'
              examples:
                default-response:
                  $ref: '#/components/examples/full-repository-default-response'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '301':
          $ref: '#/components/responses/moved_permanently'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: repos
        subcategory: repos
    patch:
      summary: Update a repository
      description: '**Note**: To edit a repository''s topics, use the [Replace all repository topics](https://docs.github.com/enterprise-server@3.15/rest/repos/repos#replace-all-repository-topics)
        endpoint.'
      tags:
      - repos
      operationId: repos/update
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.15/rest/repos/repos#update-a-repository
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the repository.
                description:
                  type: string
                  description: A short description of the repository.
                homepage:
                  type: string
                  description: A URL with more information about the repository.
                private:
                  type: boolean
                  description: "Either `true` to make the repository private or `false` to make it public.\
                    \ Default: `false`.  \n**Note**: You will get a `422` error if the organization restricts\
                    \ [changing repository visibility](https://docs.github.com/enterprise-server@3.15/articles/repository-permission-levels-for-an-organization#changing-the-visibility-of-repositories)\
                    \ to organization owners and a non-owner tries to change the value of private."
                  default: false
                visibility:
                  type: string
                  description: The visibility of the repository.
                  enum:
                  - public
                  - private
                  - internal
                security_and_analysis:
                  type: object
                  description: 'Specify which security and analysis features to enable or disable for
                    the repository.


                    To use this parameter, you must have admin permissions for the repository or be an
                    owner or security manager for the organization that owns the repository. For more
                    information, see "[Managing security managers in your organization](https://docs.github.com/enterprise-server@3.15/organizations/managing-peoples-access-to-your-organization-with-roles/managing-security-managers-in-your-organization)."


                    For example, to enable GitHub Advanced Security, use this data in the body of the
                    `PATCH` request:

                    `{ "security_and_analysis": {"advanced_security": { "status": "enabled" } } }`.


                    You can check which security and analysis features are currently enabled by using
                    a `GET /repos/{owner}/{repo}` request.'
                  nullable: true
                  properties:
                    advanced_security:
                      type: object
                      description: Use the `status` property to enable or disable GitHub Advanced Security
                        for this repository. For more information, see "[About GitHub Advanced Security](/github/getting-started-with-github/learning-about-github/about-github-advanced-security)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning for
                        this repository. For more information, see "[About secret scanning](/code-security/secret-security/about-secret-scanning)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_push_protection:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning push
                        protection for this repository. For more information, see "[Protecting pushes
                        with secret scanning](/code-security/secret-scanning/protecting-pushes-with-secret-scanning)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_non_provider_patterns:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning non-provider
                        patterns for this repository. For more information, see "[Supported secret scanning
                        patterns](/code-security/secret-scanning/introduction/supported-secret-scanning-patterns#supported-secrets)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                has_issues:
                  type: boolean
                  description: Either `true` to enable issues for this repository or `false` to disable
                    them.
                  default: true
                has_projects:
                  type: boolean
                  description: Either `true` to enable projects for this repository or `false` to disable
                    them. **Note:** If you're creating a repository in an organization that has disabled
                    repository projects, the default is `false`, and if you pass `true`, the API returns
                    an error.
                  default: true
                has_wiki:
                  type: boolean
                  description: Either `true` to enable the wiki for this repository or `false` to disable
                    it.
                  default: true
                is_template:
                  type: boolean
                  description: Either `true` to make this repo available as a template repository or `false`
                    to prevent it.
                  default: false
                default_branch:
                  type: string
                  description: Updates the default branch for this repository.
                allow_squash_merge:
                  type: boolean
                  description: Either `true` to allow squash-merging pull requests, or `false` to prevent
                    squash-merging.
                  default: true
                allow_merge_commit:
                  type: boolean
                  description: Either `true` to allow merging pull requests with a merge commit, or `false`
                    to prevent merging pull requests with merge commits.
                  default: true
                allow_rebase_merge:
                  type: boolean
                  description: Either `true` to allow rebase-merging pull requests, or `false` to prevent
                    rebase-merging.
                  default: true
                delete_branch_on_merge:
                  type: boolean
                  description: Either `true` to allow automatically deleting head branches when pull requests
                    are merged, or `false` to prevent automatic deletion.
                  default: false
                allow_update_branch:
                  type: boolean
                  description: Either `true` to always allow a pull request head branch that is behind
                    its base branch to be updated even if it is not required to be up to date before merging,
                    or false otherwise.
                  default: false
                use_squash_pr_title_as_default:
                  type: boolean
                  description: Either `true` to allow squash-merge commits to use pull request title,
                    or `false` to use commit message. **This property is closing down. Please use `squash_merge_commit_title`
                    instead.
                  default: false
                  deprecated: true
                squash_merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - COMMIT_OR_PR_TITLE
                  description: 'Required when using `squash_merge_commit_message`.


                    The default value for a squash merge commit title:


                    - `PR_TITLE` - default to the pull request''s title.

                    - `COMMIT_OR_PR_TITLE` - default to the commit''s title (if only one commit) or the
                    pull request''s title (when more than one commit).'
                squash_merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - COMMIT_MESSAGES
                  - BLANK
                  description: 'The default value for a squash merge commit message:


                    - `PR_BODY` - default to the pull request''s body.

                    - `COMMIT_MESSAGES` - default to the branch''s commit messages.

                    - `BLANK` - default to a blank commit message.'
                merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - MERGE_MESSAGE
                  description: 'Required when using `merge_commit_message`.


                    The default value for a merge commit title.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `MERGE_MESSAGE` - default to the classic title for a merge message (e.g., Merge
                    pull request #123 from branch-name).'
                merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - PR_TITLE
                  - BLANK
                  description: 'The default value for a merge commit message.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `PR_BODY` - default to the pull request''s body.

                    - `BLANK` - default to a blank commit message.'
                archived:
                  type: boolean
                  description: Whether to archive this repository. `false` will unarchive a previously
                    archived repository.
                  default: false
                allow_forking:
                  type: boolean
                  description: Either `true` to allow private forks, or `false` to prevent private forks.
                  default: false
                web_commit_signoff_required:
                  type: boolean
                  description: Either `true` to require contributors to sign off on web-based commits,
                    or `false` to not require contributors to sign off on web-based commits.
                  default: false
            examples:
              default:
                value:
                  name: Hello-World
                  description: This is your first repository
                  homepage: https://github.com
                  private: true
                  has_issues: true
                  has_projects: true
                  has_wiki: true
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/full-repository'
              examples:
                default:
                  $ref: '#/components/examples/full-repository'
        '307':
          $ref: '#/components/responses/temporary_redirect'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validation_failed'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: repos
        subcategory: repos
        previews:
        - required: false
          name: nebula
          note: 'You can set the visibility of a repository using the new `visibility` parameter in the
            [Repositories API](https://docs.github.com/enterprise-server@3.15/rest/repos), and get a repository''s
            visibility with a new response key. For more information, see the [blog post](https://developer.github.com/changes/2019-12-03-internal-visibility-changes/).


            To access repository visibility during the preview period, you must provide a custom [media
            type](https://docs.github.com/enterprise-server@3.15/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)
            in the `Accept` header:

            ```shell

            application/vnd.github.nebula-preview+json

            ```'
        - required: false
          name: baptiste
          note: 'The `is_template` and `template_repository` keys are currently available for developer
            to preview. See [Create a repository using a template](https://docs.github.com/enterprise-server@3.15/rest/repos/repos#create-a-repository-using-a-template)
            to learn how to create template repositories. To access these new response keys during the
            preview period, you must provide a custom [media type](https://docs.github.com/enterprise-server@3.15/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)
            in the `Accept` header:


            ```shell

            application/vnd.github.baptiste-preview+json

            ```'
    delete:
      summary: Delete a repository
      description: 'Deleting a repository requires admin access.


        If an organization owner has configured the organization to prevent members from deleting organization-owned

        repositories, you will get a `403 Forbidden` response.


        OAuth app tokens and personal access tokens (classic) need the `delete_repo` scope to use this
        endpoint.'
      tags:
      - repos
      operationId: repos/delete
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.15/rest/repos/repos#delete-a-repository
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      responses:
        '204':
          description: Response
        '403':
          description: 'If an organization owner has configured the organization to prevent members from
            deleting organization-owned repositories, a member will get this response:'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  documentation_url:
                    type: string
              examples:
                default:
                  value:
                    message: Organization members cannot delete repositories.
                    documentation_url: https://docs.github.com/enterprise-server@3.15/rest/repos/repos#delete-a-repository
        '307':
          $ref: '#/components/responses/temporary_redirect'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: repos
        subcategory: repos
  /users/{username}/followers:
    get:
      summary: List followers of a user
      description: Lists the people following the specified user.
      tags:
      - users
      operationId: users/list-followers-for-user
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.15/rest/users/followers#list-followers-of-a-user
      parameters:
      - $ref: '#/components/parameters/username'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/simple-user'
              examples:
                default:
                  $ref: '#/components/examples/simple-user-items'
          headers:
            Link:
              $ref: '#/components/headers/link'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: users
        subcategory: followers
  /orgs/{org}:
    get:
      summary: Get an organization
      description: 'Gets information about an organization.


        When the value of `two_factor_requirement_enabled` is `true`, the organization requires all members,
        billing managers, and outside collaborators to enable [two-factor authentication](https://docs.github.com/enterprise-server@3.15/articles/securing-your-account-with-two-factor-authentication-2fa/).


        To see the full details about an organization, the authenticated user must be an organization
        owner.


        OAuth app tokens and personal access tokens (classic) need the `admin:org` scope to see the full
        details about an organization.


        To see information about an organization''s GitHub Enterprise Server plan, GitHub Apps need the
        `Organization plan` permission.'
      tags:
      - orgs
      operationId: orgs/get
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.15/rest/orgs/orgs#get-an-organization
      parameters:
      - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-full'
              examples:
                default-response:
                  $ref: '#/components/examples/organization-full'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: orgs
        subcategory: orgs
    patch:
      summary: Update an organization
      description: '> [!WARNING]

        > **Closing down notice:** GitHub Enterprise Server will replace and discontinue `members_allowed_repository_creation_type`
        in favor of more granular permissions. The new input parameters are `members_can_create_public_repositories`,
        `members_can_create_private_repositories` for all organizations and `members_can_create_internal_repositories`
        for organizations associated with an enterprise account using GitHub Enterprise Cloud or GitHub
        Enterprise Server 2.20+. For more information, see the [blog post](https://developer.github.com/changes/2019-12-03-internal-visibility-changes).


        Updates the organization''s profile and member privileges.


        The authenticated user must be an organization owner to use this endpoint.


        OAuth app tokens and personal access tokens (classic) need the `admin:org` or `repo` scope to
        use this endpoint.'
      tags:
      - orgs
      operationId: orgs/update
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.15/rest/orgs/orgs#update-an-organization
      parameters:
      - $ref: '#/components/parameters/org'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                billing_email:
                  type: string
                  description: Billing email address. This address is not publicized.
                company:
                  type: string
                  description: The company name.
                email:
                  type: string
                  description: The publicly visible email address.
                twitter_username:
                  type: string
                  description: The Twitter username of the company.
                location:
                  type: string
                  description: The location.
                name:
                  type: string
                  description: The shorthand name of the company.
                description:
                  type: string
                  description: The description of the company. The maximum size is 160 characters.
                has_organization_projects:
                  type: boolean
                  description: Whether an organization can use organization projects.
                has_repository_projects:
                  type: boolean
                  description: Whether repositories that belong to the organization can use repository
                    projects.
                default_repository_permission:
                  type: string
                  description: Default permission level members have for organization repositories.
                  enum:
                  - read
                  - write
                  - admin
                  - none
                  default: read
                members_can_create_repositories:
                  type: boolean
                  description: Whether of non-admin organization members can create repositories. **Note:**
                    A parameter can override this parameter. See `members_allowed_repository_creation_type`
                    in this table for details.
                  default: true
                members_can_create_internal_repositories:
                  type: boolean
                  description: Whether organization members can create internal repositories, which are
                    visible to all enterprise members. You can only allow members to create internal repositories
                    if your organization is associated with an enterprise account using GitHub Enterprise
                    Cloud or GitHub Enterprise Server 2.20+. For more information, see "[Restricting repository
                    creation in your organization](https://docs.github.com/enterprise-server@3.15/github/setting-up-and-managing-organizations-and-teams/restricting-repository-creation-in-your-organization)"
                    in the GitHub Help documentation.
                members_can_create_private_repositories:
                  type: boolean
                  description: Whether organization members can create private repositories, which are
                    visible to organization members with permission. For more information, see "[Restricting
                    repository creation in your organization](https://docs.github.com/enterprise-server@3.15/github/setting-up-and-managing-organizations-and-teams/restricting-repository-creation-in-your-organization)"
                    in the GitHub Help documentation.
                members_can_create_public_repositories:
                  type: boolean
                  description: Whether organization members can create public repositories, which are
                    visible to anyone. For more information, see "[Restricting repository creation in
                    your organization](https://docs.github.com/enterprise-server@3.15/github/setting-up-and-managing-organizations-and-teams/restricting-repository-creation-in-your-organization)"
                    in the GitHub Help documentation.
                members_allowed_repository_creation_type:
                  type: string
                  description: "Specifies which types of repositories non-admin organization members can\
                    \ create. \n**Note:** This parameter is closing down and will be removed in the future.\
                    \ Its return value ignores internal repositories. Using this parameter overrides values\
                    \ set in `members_can_create_repositories`. See the parameter deprecation notice in\
                    \ the operation description for details."
                  enum:
                  - all
                  - private
                  - none
                members_can_create_pages:
                  type: boolean
                  description: Whether organization members can create GitHub Pages sites. Existing published
                    sites will not be impacted.
                  default: true
                members_can_fork_private_repositories:
                  type: boolean
                  description: Whether organization members can fork private organization repositories.
                  default: false
                web_commit_signoff_required:
                  type: boolean
                  description: Whether contributors to organization repositories are required to sign
                    off on commits they make through GitHub's web interface.
                  default: false
                blog:
                  type: string
                  example: '"http://github.blog"'
                advanced_security_enabled_for_new_repositories:
                  type: boolean
                  description: 'Whether GitHub Advanced Security is automatically enabled for new repositories
                    and repositories transferred to this organization.


                    To use this parameter, you must have admin permissions for the repository or be an
                    owner or security manager for the organization that owns the repository. For more
                    information, see "[Managing security managers in your organization](https://docs.github.com/enterprise-server@3.15/organizations/managing-peoples-access-to-your-organization-with-roles/managing-security-managers-in-your-organization)."


                    You can check which security and analysis features are currently enabled by using
                    a `GET /orgs/{org}` request.'
                dependabot_alerts_enabled_for_new_repositories:
                  type: boolean
                  description: 'Whether Dependabot alerts is automatically enabled for new repositories
                    and repositories transferred to this organization.


                    To use this parameter, you must have admin permissions for the repository or be an
                    owner or security manager for the organization that owns the repository. For more
                    information, see "[Managing security managers in your organization](https://docs.github.com/enterprise-server@3.15/organizations/managing-peoples-access-to-your-organization-with-roles/managing-security-managers-in-your-organization)."


                    You can check which security and analysis features are currently enabled by using
                    a `GET /orgs/{org}` request.'
                dependabot_security_updates_enabled_for_new_repositories:
                  type: boolean
                  description: 'Whether Dependabot security updates is automatically enabled for new repositories
                    and repositories transferred to this organization.


                    To use this parameter, you must have admin permissions for the repository or be an
                    owner or security manager for the organization that owns the repository. For more
                    information, see "[Managing security managers in your organization](https://docs.github.com/enterprise-server@3.15/organizations/managing-peoples-access-to-your-organization-with-roles/managing-security-managers-in-your-organization)."


                    You can check which security and analysis features are currently enabled by using
                    a `GET /orgs/{org}` request.'
                dependency_graph_enabled_for_new_repositories:
                  type: boolean
                  description: 'Whether dependency graph is automatically enabled for new repositories
                    and repositories transferred to this organization.


                    To use this parameter, you must have admin permissions for the repository or be an
                    owner or security manager for the organization that owns the repository. For more
