# Swagger 2.0 fixture exercising the constructs lib/openapi/v2 needs to read: host/basePath/
# schemes, definitions, a body parameter, formData parameters, query/path parameters with
# collectionFormat, securityDefinitions (apiKey + oauth2 accessCode), and the x-nullable
# convention.
swagger: "2.0"
info:
  title: Swagger Petstore
  version: 1.0.0
host: petstore.swagger.io
basePath: /v2
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  api_key:
    type: apiKey
    name: X-Api-Key
    in: header
  petstore_auth:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://petstore.swagger.io/oauth/authorize
    tokenUrl: https://petstore.swagger.io/oauth/token
    scopes:
      write:pets: modify pets
      read:pets: read pets
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: tags
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: limit
          in: query
          type: integer
      responses:
        "200":
          description: A list of pets
          schema:
            type: array
            items:
              $ref: "#/definitions/Pet"
    post:
      operationId: createPet
      security:
        - petstore_auth:
            - write:pets
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Pet"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/Pet"
  /pets/{petId}/photo:
    post:
      operationId: uploadPetPhoto
      consumes:
        - multipart/form-data
      parameters:
        - name: petId
          in: path
          required: true
          type: integer
        - name: caption
          in: formData
          type: string
        - name: file
          in: formData
          type: file
          required: true
      responses:
        "200":
          description: Uploaded
definitions:
  Pet:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      tag:
        type: string
        x-nullable: true
